name: Dodgewing CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logic:
    name: Build and logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm test

  browser:
    name: Browser smoke and campaign tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start Dodgewing server
        run: |
          nohup npm start > /tmp/dodgewing-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5500/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dodgewing-server.log
          exit 1
      - name: Run browser tests
        run: npm run test:browser

  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare offline Android asset
        run: npm run prepare:android
      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dodgewing-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
